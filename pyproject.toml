[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dotfiles-drift"
version = "0.1.0"
description = "Detect drift between your dotfiles repo and your actual machine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Yunare Maia", email = "yunare@gmail.com"}
]
keywords = ["dotfiles", "drift", "sync", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
dotfiles-drift = "dotfiles_drift.cli:main"

[project.urls]
Homepage = "https://github.com/yunaremaia/dotfiles-drift"
Repository = "https://github.com/yunaremaia/dotfiles-drift"
Issues = "https://github.com/yunaremaia/dotfiles-drift/issues"
Changelog = "https://github.com/yunaremaia/dotfiles-drift/blob/main/CHANGELOG.md"
